<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="btn-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bg-grad)" />
  <rect x="6" y="6" width="88" height="88" rx="23" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Inner Display -->
  <rect x="18" y="18" width="64" height="22" rx="8" fill="url(#screen-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <!-- Display Digits Glow Indicator -->
  <circle cx="26" cy="29" r="3" fill="#38bdf8" filter="url(#glow)" />
  <rect x="42" y="27" width="32" height="4" rx="2" fill="#a5b4fc" />

  <!-- Keypad Grid (2x3 buttons) -->
  <!-- Row 1 -->
  <rect x="18" y="48" width="16" height="13" rx="5" fill="rgba(255,255,255,0.2)" />
  <rect x="42" y="48" width="16" height="13" rx="5" fill="rgba(255,255,255,0.2)" />
  <rect x="66" y="48" width="16" height="13" rx="5" fill="url(#btn-accent)" />

  <!-- Row 2 -->
  <rect x="18" y="67" width="16" height="15" rx="5" fill="rgba(255,255,255,0.2)" />
  <rect x="42" y="67" width="16" height="15" rx="5" fill="rgba(255,255,255,0.2)" />
  <rect x="66" y="67" width="16" height="15" rx="5" fill="#f43f5e" />
</svg>
